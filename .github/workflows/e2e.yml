name: E2E Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Wait for Vercel deployment
        id: vercel
        run: |
          echo "Waiting for Vercel deployment of commit $GITHUB_SHA..."
          for i in $(seq 1 30); do
            URL=$(curl -sf "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=20" \
              -H "Authorization: Bearer $VERCEL_TOKEN" | \
              jq -r --arg sha "$GITHUB_SHA" \
              '.deployments[] | select(.meta.githubCommitSha == $sha and .readyState == "READY") | "https://" + .url' \
              | head -1)
            if [ -n "$URL" ]; then
              echo "Deployment ready: $URL"
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "Timed out waiting for Vercel deployment"
          exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Run E2E tests
        env:
          TEST_BASE_URL: ${{ steps.vercel.outputs.url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PLAYER_EMAIL: ${{ secrets.PLAYER_EMAIL }}
          PLAYER_PASSWORD: ${{ secrets.PLAYER_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
